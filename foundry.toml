[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evmVersion = "cancun"
verbosity = 1
fs_permissions = [
    { access = "read", path = "./script/input" },
    { access = "read-write", path = "./script/output" },
]

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"

[etherscan]
mainnet = { key = "${MAINNET_API_KEY}" }

[lint]
lint_on_build = false
